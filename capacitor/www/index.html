<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HairTrack</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7f7f5;
        color: #1a1a1a;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #6b6b6b;
        font-size: 15px;
      }
      a {
        margin-top: 12px;
        background: #111;
        color: #fff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 600;
      }
      .or {
        color: #c9a227;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="or">HAIRTRACK</div>
      <h1>Connexion indisponible</h1>
      <p>Vérifiez votre connexion internet, puis réessayez.</p>
      <a href="https://hairtrack.fr">Réessayer</a>
    </div>
  </body>
</html>
